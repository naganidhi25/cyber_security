<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Account Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: red;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #007BFF;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">SecureMail</div>
    <h2>Account Login</h2>

    <form onsubmit="return handleLogin(event)">
        <input type="text" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="footer">
        ⚠ This is a phishing awareness simulation. Do not enter real credentials.
    </div>
</div>

<script>
function handleLogin(event) {
    event.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    alert("Simulation Recorded!\nEmail: " + email + "\nPassword: " + password);

    return false;
}
</script>

</body>
</html>
